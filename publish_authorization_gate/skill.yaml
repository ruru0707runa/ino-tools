  rationale: 'The system base social_publishing changed again to revision dd011614fcbffac3b3d5cc8c7bea4ee2d7cf0a7e656c0067b03d27b989beb29f. I re-read the current base at /opt/muse/skills/social-publishing/SKILL.md: its approval section still only requires showing the exact post and treating approval as covering only what the user saw, and it still does not state that choosing between options is not publish permission or that silence is not permission. The publish_authorization_gate amendment therefore remains needed with no wording change; this proposal renews only its reviewed_revision and review metadata. Other window signals were checked and rejected: the yuuki day-1 restart recoveries reported lateness plainly with no duplicates and the base already covers looking up a post or schedule before retrying, the growth-account number correction was a single instance consistent with existing performance guidance, and the 48 terminal failures are bare tool names with no shared instruction gap.'
