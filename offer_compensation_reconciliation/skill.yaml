  measurement:
    proxy_metric_id: objective_success_rate
    success_criterion: Every salary memo and offer summary in the post-install window recomputes monthly pay times 12 plus only confirmed bonus, shows payer and period coverage, and surfaces gaps without rounding, with no user correction about double counting or an unconfirmed bonus.
    window_days: 30
  needs_review: false
  rationale: 'Salary arithmetic recurred across several employers in this window and was corrected only after user intervention. An earlier summary used an unconfirmed figure that included an unreceived bonus, and an initial multiplication did not match the confirmed monthly figure. In the latest employer exchange the assistant had to flag that adding four months of payslips to a withholding total would double count if that total already covered those months, and the user then confirmed the payer was the current employer with one prior employer missing. The dermatology offer showed the same need in another form: a 450 total against a confirmed 580 current figure, with attendance and staged duty allowances and a first year bonus exclusion changing what the total really meant. No existing skill found by search covers offer reconciliation against payslips and withholding slips. This new skill codifies the corrected method without any personal figure, company name, or document content, and it leaves the existing verified_visual_generation skill untouched because that skill is still inside its measurement window and only one learned skill exists, so no consolidation is triggered.'
